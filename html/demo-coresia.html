<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rubi Dashboard - CoreS3 Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #0a0e27;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      display: flex;
      gap: 30px;
      max-width: 900px;
      align-items: flex-start;
    }

    /* Dashboard Canvas */
    .dashboard-area {
      flex: 0 0 auto;
    }

    canvas {
      display: block;
      width: 320px;
      height: 240px;
      border: 2px solid #00d4ff;
      border-radius: 4px;
      background: #0a0e27;
      image-rendering: pixelated;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }

    /* Control Panel */
    .control-panel {
      flex: 1;
      min-width: 280px;
    }

    .panel-title {
      font-size: 18px;
      font-weight: bold;
      color: #00d4ff;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Metrics Display */
    .metrics-box {
      background: #1a2351;
      border: 1px solid #00d4ff;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .metric-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #2a3361;
      font-size: 13px;
    }

    .metric-item:last-child {
      border-bottom: none;
    }

    .metric-label {
      color: #888;
      text-transform: uppercase;
      font-size: 11px;
    }

    .metric-value {
      color: #00d4ff;
      font-weight: bold;
      font-family: monospace;
    }

    .metric-value.critical {
      color: #ff0055;
    }

    .metric-value.warning {
      color: #ffaa00;
    }

    .metric-value.ok {
      color: #00ff00;
    }

    /* State Selection */
    .state-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .state-btn {
      padding: 8px;
      background: #1a2351;
      border: 1px solid #00d4ff;
      color: #00d4ff;
      border-radius: 3px;
      cursor: pointer;
      font-family: monospace;
      font-size: 11px;
      font-weight: bold;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .state-btn:hover {
      background: #2a3361;
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
    }

    .state-btn:active {
      transform: scale(0.95);
    }

    /* Demo Button */
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .demo-btn {
      padding: 10px;
      background: linear-gradient(135deg, #00d4ff, #0084ff);
      border: none;
      color: #0a0e27;
      font-weight: bold;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      text-transform: uppercase;
      transition: all 0.2s;
      grid-column: 1 / -1;
    }

    .demo-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
    }

    .info-btn {
      padding: 8px;
      background: #1a2351;
      border: 1px solid #00d4ff;
      color: #00d4ff;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .info-btn:hover {
      background: #2a3361;
    }

    /* Status Bar */
    .status-bar {
      background: #1a2351;
      border: 1px solid #1a5a6a;
      border-radius: 3px;
      padding: 10px;
      font-size: 11px;
      color: #888;
      text-align: center;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
      background: #888;
    }

    .status-indicator.online {
      background: #00ff00;
    }

    .status-indicator.offline {
      background: #ff0055;
    }

    /* Documentation */
    .docs-section {
      background: #0a0e27;
      border: 1px solid #1a5a6a;
      border-radius: 3px;
      padding: 12px;
      margin-top: 20px;
      font-size: 11px;
    }

    .docs-section h4 {
      color: #00d4ff;
      margin-bottom: 8px;
      font-size: 12px;
      text-transform: uppercase;
    }

    .docs-section p {
      color: #888;
      line-height: 1.5;
      margin-bottom: 5px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        gap: 20px;
      }

      .control-panel {
        width: 100%;
      }

      canvas {
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Dashboard Canvas -->
    <div class="dashboard-area">
      <canvas id="coresia-canvas" width="320" height="240"></canvas>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
      <div class="panel-title">📊 CoreS3 Dashboard</div>

      <!-- Metrics -->
      <div class="metrics-box">
        <div class="metric-item">
          <span class="metric-label">CPU</span>
          <span class="metric-value ok" id="metric-cpu">25%</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Memory</span>
          <span class="metric-value ok" id="metric-memory">45%</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Network</span>
          <span class="metric-value ok" id="metric-network">ONLINE</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Model</span>
          <span class="metric-value" id="metric-model">Qwen-1.7B</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">Temperature</span>
          <span class="metric-value ok" id="metric-temp">52°C</span>
        </div>
      </div>

      <!-- Demo & Actions -->
      <div class="button-group">
        <button class="demo-btn" id="btn-demo">▶️ Run Demo</button>
      </div>

      <!-- State Selection -->
      <div class="state-grid">
        <button class="state-btn" data-state="idle">Idle</button>
        <button class="state-btn" data-state="thinking">Think</button>
        <button class="state-btn" data-state="talking">Talk</button>
        <button class="state-btn" data-state="success">Success</button>
      </div>

      <!-- Quick Actions -->
      <div class="button-group">
        <button class="info-btn" id="btn-refresh">🔄 Refresh</button>
        <button class="info-btn" id="btn-info">ℹ️ Info</button>
      </div>

      <!-- Status -->
      <div class="status-bar">
        <span class="status-indicator online"></span>
        <span id="status-text">System Ready</span>
      </div>

      <!-- Documentation -->
      <div class="docs-section">
        <h4>📖 About</h4>
        <p>
          M5Stack CoreS3 Smart Display with Rubi Avatar
        </p>
        <p>
          Real-time system monitoring + AI model status
        </p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../assets/components/coresia-dashboard.js"></script>
  <script>
    class CoreS3Demo {
      constructor() {
        this.dashboard = new CoreS3Dashboard({
          width: 320,
          height: 240,
          theme: 'dark',
        });

        this.metrics = {
          cpu: 25,
          memory: 45,
          network: 'online',
          modelRunning: 'Qwen-1.7B',
          temperature: 52,
        };

        this.isRunning = false;
        this.isSimulating = false;
      }

      async initialize() {
        console.log('🤖 Initializing CoreS3 Demo...');

        if (!this.dashboard.initialize()) {
          console.error('Failed to initialize display');
          return false;
        }

        // Load sprites
        try {
          await this.dashboard.loadSprite('idle.png');
          await this.dashboard.loadSprite('blink.png');
          await this.dashboard.loadSprite('mouth_open.png');
          await this.dashboard.loadSprite('mouth_closed.png');
          console.log('✓ Sprites loaded');
        } catch (error) {
          console.warn('Sprite loading failed:', error);
        }

        this.setupEventListeners();
        this.dashboard.render();
        this.startMetricsSimulation();

        return true;
      }

      setupEventListeners() {
        document.getElementById('btn-demo')?.addEventListener('click', () => {
          this.runDemo();
        });

        document.getElementById('btn-refresh')?.addEventListener('click', () => {
          this.refreshMetrics();
        });

        document.getElementById('btn-info')?.addEventListener('click', () => {
          this.showInfo();
        });

        document.querySelectorAll('.state-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const state = btn.dataset.state;
            this.dashboard.setState(state);
            this.updateStatusText(`State: ${state.toUpperCase()}`);
          });
        });
      }

      startMetricsSimulation() {
        setInterval(() => {
          if (!this.isSimulating) {
            this.updateMetrics();
            this.dashboard.updateMetrics(this.metrics);
            this.updateMetricsDisplay();
          }
        }, 1000);
      }

      updateMetrics() {
        // Simulate realistic metrics
        this.metrics.cpu = Math.max(
          5,
          Math.min(100, this.metrics.cpu + Math.random() * 20 - 10)
        );
        this.metrics.memory = Math.max(
          20,
          Math.min(90, this.metrics.memory + Math.random() * 10 - 5)
        );
        this.metrics.temperature = Math.max(
          45,
          Math.min(75, this.metrics.temperature + Math.random() * 4 - 2)
        );

        if (Math.random() > 0.98) {
          this.metrics.network =
            this.metrics.network === 'online' ? 'offline' : 'online';
        }
      }

      updateMetricsDisplay() {
        document.getElementById('metric-cpu').textContent = Math.round(
          this.metrics.cpu
        ) + '%';
        document.getElementById('metric-cpu').className =
          'metric-value ' + this.getMetricClass(this.metrics.cpu);

        document.getElementById('metric-memory').textContent = Math.round(
          this.metrics.memory
        ) + '%';
        document.getElementById('metric-memory').className =
          'metric-value ' + this.getMetricClass(this.metrics.memory);

        document.getElementById('metric-network').textContent = this.metrics.network.toUpperCase();
        document.getElementById('metric-network').className =
          'metric-value ' + (this.metrics.network === 'online' ? 'ok' : 'critical');

        document.getElementById('metric-temp').textContent = Math.round(
          this.metrics.temperature
        ) + '°C';
        document.getElementById('metric-temp').className =
          'metric-value ' + this.getMetricClass(this.metrics.temperature, 70);
      }

      getMetricClass(value, warning = 75) {
        if (value < warning) return 'ok';
        if (value < 90) return 'warning';
        return 'critical';
      }

      async runDemo() {
        if (this.isRunning) return;
        this.isRunning = true;
        this.isSimulating = true;

        const sequence = [
          { state: 'idle', duration: 1000 },
          { state: 'thinking', duration: 2000 },
          { state: 'talking', duration: 2000 },
          { state: 'success', duration: 800 },
          { state: 'idle', duration: 500 },
        ];

        for (const item of sequence) {
          this.dashboard.setState(item.state);
          this.updateStatusText(`Demo: ${item.state.toUpperCase()}`);
          await this.sleep(item.duration);
        }

        this.isRunning = false;
        this.isSimulating = false;
        this.updateStatusText('System Ready');
      }

      refreshMetrics() {
        this.updateMetrics();
        this.updateMetricsDisplay();
        this.updateStatusText('Metrics refreshed');
        setTimeout(() => this.updateStatusText('System Ready'), 2000);
      }

      showInfo() {
        this.dashboard.showInfo('JSEBot CoreS3', {
          'Version': '2026.3.2',
          'Display': '320×240',
          'Model': 'Qwen-1.7B',
          'Status': 'Ready',
        });

        setTimeout(() => {
          this.dashboard.setState('idle');
        }, 3000);
      }

      updateStatusText(text) {
        const status = document.getElementById('status-text');
        if (status) status.textContent = text;
      }

      sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      destroy() {
        this.dashboard.destroy();
      }
    }

    // Initialize
    let demo;
    document.addEventListener('DOMContentLoaded', () => {
      demo = new CoreS3Demo();
      demo.initialize().then(success => {
        if (success) {
          console.log('✓ CoreS3 demo ready');
          demo.dashboard.setState('idle');
        }
      });
    });

    window.addEventListener('beforeunload', () => {
      if (demo) demo.destroy();
    });
  </script>
</body>
</html>
