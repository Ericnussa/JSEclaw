<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="JSEBot error splash screen">
  <defs>
    <!-- Error red gradient -->
    <linearGradient id="errorGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    
    <!-- Subtle error glow -->
    <radialGradient id="errorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Dark background with red tint -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    
    <!-- Filter for soft glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with red tint -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  <rect width="1920" height="1080" fill="#8b0000" opacity="0.08"/>
  
  <!-- Subtle accent grid lines -->
  <g stroke="#6b1a1a" stroke-width="1" opacity="0.15">
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
  </g>
  
  <!-- Error glow circle -->
  <circle cx="960" cy="380" r="300" fill="url(#errorGlow)" opacity="0.5"/>
  
  <!-- Robot Icon Container with error state (X eyes) -->
  <g transform="translate(960, 380)" filter="url(#softGlow)">
    <!-- Scale factor: 520/256 = 2.03125 -->
    <g transform="scale(2.03125)">
      <!-- Body -->
      <rect x="44" y="56" width="168" height="140" rx="26" fill="#2a2a3a" stroke="#4a4a5a" stroke-width="8"/>
      
      <!-- Head -->
      <rect x="78" y="26" width="100" height="36" rx="14" fill="#3a3a4a" stroke="#4a4a5a" stroke-width="8"/>
      
      <!-- Left Eye - X (sad) -->
      <line x1="90" y1="112" x2="110" y2="132" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
      <line x1="110" y1="112" x2="90" y2="132" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Right Eye - X (sad) -->
      <line x1="146" y1="112" x2="166" y2="132" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
      <line x1="166" y1="112" x2="146" y2="132" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
      
      <!-- Mouth - down curved (sad) -->
      <path d="M 96 165 Q 128 158 160 165" stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round"/>
      
      <!-- Left Arm -->
      <rect x="26" y="98" width="20" height="52" rx="10" fill="#4a4a5a" stroke="#3a3a4a" stroke-width="8"/>
      
      <!-- Right Arm -->
      <rect x="210" y="98" width="20" height="52" rx="10" fill="#4a4a5a" stroke="#3a3a4a" stroke-width="8"/>
      
      <!-- Antenna Base -->
      <circle cx="128" cy="26" r="10" fill="#4a4a5a"/>
      
      <!-- Antenna -->
      <rect x="124" y="6" width="8" height="20" rx="4" fill="#4a4a5a"/>
    </g>
  </g>
  
  <!-- Error Title -->
  <text x="960" y="800" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="96" font-weight="700" text-anchor="middle" fill="#ef4444" letter-spacing="2">
    Something went wrong
  </text>
  
  <!-- Error Message -->
  <text x="960" y="880" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="32" text-anchor="middle" fill="#fca5a5" opacity="0.9" letter-spacing="0.5">
    Please try again or check the logs
  </text>
</svg>