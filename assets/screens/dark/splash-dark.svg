<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="JSEBot dark mode splash screen">
  <defs>
    <!-- Main gradient for branding (bright cyan for dark mode) -->
    <linearGradient id="darkMainGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    
    <!-- Neon glow effect for dark mode -->
    <radialGradient id="darkGlowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Dark background gradient -->
    <linearGradient id="darkBgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    
    <!-- Neon glow filter -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow shadow for neon effect -->
    <filter id="neonShadow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#06b6d4" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feComposite in="glow" in2="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#darkBgGradient)"/>
  
  <!-- Subtle accent grid lines (dark) -->
  <g stroke="#0ea5e9" stroke-width="1" opacity="0.08">
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="1080" opacity="0.05"/>
    <line x1="1440" y1="0" x2="1440" y2="1080" opacity="0.05"/>
  </g>
  
  <!-- Neon glow circle background for robot (larger for dark mode) -->
  <circle cx="960" cy="420" r="320" fill="url(#darkGlowGradient)" opacity="0.8"/>
  
  <!-- Glow ring for neon effect -->
  <circle cx="960" cy="420" r="300" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3"/>
  
  <!-- Robot Icon Container - Neon style for dark mode -->
  <g transform="translate(960, 420)" filter="url(#neonGlow)">
    <!-- Scale factor: 520/256 = 2.03125 -->
    <g transform="scale(2.03125)">
      <!-- Body with neon glow -->
      <rect x="44" y="56" width="168" height="140" rx="26" fill="url(#darkMainGradient)" stroke="#06b6d4" stroke-width="8" opacity="0.95"/>
      
      <!-- Head (lighter neon accent) -->
      <rect x="78" y="26" width="100" height="36" rx="14" fill="#0ea5e9" stroke="#06b6d4" stroke-width="6"/>
      
      <!-- Left Eye (glowing) -->
      <circle cx="100" cy="122" r="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
      <circle cx="100" cy="122" r="12" fill="#0ea5e9" opacity="0.7"/>
      
      <!-- Right Eye (glowing) -->
      <circle cx="156" cy="122" r="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
      <circle cx="156" cy="122" r="12" fill="#0ea5e9" opacity="0.7"/>
      
      <!-- Mouth (glowing) -->
      <rect x="96" y="158" width="64" height="12" rx="6" fill="#0ea5e9"/>
      
      <!-- Left Arm (cat ear antenna indicator) -->
      <rect x="26" y="98" width="20" height="52" rx="10" fill="#06b6d4" stroke="#0ea5e9" stroke-width="6" opacity="0.9"/>
      
      <!-- Right Arm (cat ear antenna indicator) -->
      <rect x="210" y="98" width="20" height="52" rx="10" fill="#06b6d4" stroke="#0ea5e9" stroke-width="6" opacity="0.9"/>
      
      <!-- Antenna Base -->
      <circle cx="128" cy="26" r="10" fill="#0ea5e9"/>
      
      <!-- Antenna (neon glow) -->
      <rect x="124" y="6" width="8" height="20" rx="4" fill="#06b6d4" stroke="#0ea5e9" stroke-width="1" opacity="0.9"/>
    </g>
  </g>
  
  <!-- JSEBot Title (neon cyan) -->
  <text x="960" y="780" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="96" font-weight="700" text-anchor="middle" fill="#06b6d4" letter-spacing="4" opacity="0.95" filter="url(#neonShadow)">
    JSEBot
  </text>
  
  <!-- Tagline (bright accent) -->
  <text x="960" y="860" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="32" text-anchor="middle" fill="#bae6fd" opacity="0.85" letter-spacing="1">
    Your AI-Powered CLI Assistant
  </text>
  
  <!-- Version (with glow) -->
  <text x="960" y="1020" font-family="'Monaco', 'Courier New', monospace" font-size="18" text-anchor="middle" fill="#0ea5e9" opacity="0.8" letter-spacing="1">
    v0.1.1
  </text>
</svg>
